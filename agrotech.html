<style>
/* =====================================================================
   AGROTECH OPERATIONS INTELLIGENCE — estilos (migrable a /css/styles.css)
   ===================================================================== */
:root{--bg:#f3f5f9;--panel:rgba(255,255,255,.86);--solid:#fff;--panel2:#f6f8fc;--tx:#0b1220;--mut:#64748b;--bd:#e3e8f0;--acc:#1f5bff;--acc2:#e6edff;--ok:#16a34a;--okb:#dcfce7;--warn:#d97706;--warnb:#fef3c7;--bad:#dc2626;--badb:#fee2e2;--info:#2563eb;--infob:#dbeafe;--sh:0 1px 2px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.06);--r:16px;--side:#0b1326;--sidetx:#b9c3d8}
[data-theme=dark]{--bg:#070b16;--panel:rgba(18,26,46,.82);--solid:#121a2e;--panel2:#0e1526;--tx:#e8edf8;--mut:#8a97b3;--bd:#232e49;--acc:#4d7dff;--acc2:#16224a;--okb:#0f2e1c;--warnb:#3a2a0b;--badb:#3b1215;--infob:#12244d;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--side:#050810}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(900px 400px at 85% -10%,rgba(31,91,255,.08),transparent),radial-gradient(700px 400px at -10% 100%,rgba(22,163,74,.05),transparent);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sb{background:var(--side);color:var(--sidetx);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px;z-index:40}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;color:#fff}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#1f5bff,#00c2ff);display:grid;place-items:center;font-weight:800;color:#fff}
.brand b{display:block;font-size:14px;letter-spacing:.2px}.brand small{font-size:10px;color:#7f8cab;letter-spacing:1.2px;text-transform:uppercase}
.nv{display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:11px;cursor:pointer;color:var(--sidetx);text-decoration:none;font-weight:500;transition:.15s}
.nv:hover{background:rgba(255,255,255,.07);color:#fff}.nv.on{background:linear-gradient(90deg,rgba(31,91,255,.9),rgba(31,91,255,.55));color:#fff;box-shadow:0 6px 18px rgba(31,91,255,.35)}
.nv .ic{width:20px;text-align:center}
.sbf{margin-top:auto;font-size:11px;color:#7f8cab;padding:10px 8px;border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0}
.top{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;padding:12px 24px;background:var(--panel);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.search{position:relative;flex:1;max-width:560px}
.search input{width:100%;padding:10px 14px 10px 36px;border-radius:12px;border:1px solid var(--bd);background:var(--solid)}
.search:before{content:"⌕";position:absolute;left:13px;top:7px;font-size:18px;color:var(--mut)}
.search input:focus,.tin:focus,.fi:focus{outline:2px solid var(--acc);border-color:transparent}
.gsr{position:absolute;top:46px;left:0;right:0;background:var(--solid);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);max-height:420px;overflow:auto;display:none;z-index:50}
.gsr.on{display:block}.gsr a{display:flex;gap:10px;padding:10px 14px;cursor:pointer;align-items:center;border-bottom:1px solid var(--bd)}.gsr a:hover{background:var(--acc2)}
.gsr small{color:var(--mut)}
#view{padding:24px;max-width:1500px;margin:auto;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.btn{border:1px solid var(--bd);background:var(--solid);padding:8px 14px;border-radius:11px;cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:9px}
.btn.inv{background:linear-gradient(90deg,#1f5bff,#00a3ff);color:#fff;border:0;box-shadow:0 6px 18px rgba(31,91,255,.35)}
#menuBtn{display:none}
h1{font-size:24px;letter-spacing:-.4px}h2{font-size:17px}h3{font-size:15px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph p{color:var(--mut);margin-top:3px}
.card{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g12{grid-template-columns:2fr 1fr}.g21{grid-template-columns:1fr 2fr}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--bd);border-left:4px solid var(--info);border-radius:14px;padding:13px 15px;cursor:pointer;transition:.18s;box-shadow:var(--sh)}
.kpi:hover{transform:translateY(-3px)}.kpi small{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.kpi b{display:block;font-size:24px;margin:3px 0;letter-spacing:-.5px}.kpi span{font-size:12px;color:var(--mut)}
.kpi.ok{border-left-color:var(--ok)}.kpi.warn{border-left-color:var(--warn)}.kpi.bad{border-left-color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-bad{background:var(--badb);color:var(--bad)}.b-info{background:var(--infob);color:var(--info)}.b-mut{background:var(--panel2);color:var(--mut);border:1px solid var(--bd)}
.dtag{font-size:9.5px;font-weight:800;letter-spacing:.7px;padding:2px 7px;border-radius:6px;vertical-align:middle}
.dtag.case{background:#e0e7ff;color:#3730a3}.dtag.demo{background:#fef3c7;color:#92400e}
[data-theme=dark] .dtag.case{background:#232a63;color:#c7d2fe}[data-theme=dark] .dtag.demo{background:#463408;color:#fde68a}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--bd);padding:4px;border-radius:13px;margin-bottom:16px;width:fit-content;max-width:100%}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--solid);color:var(--acc);box-shadow:var(--sh)}
.tw .tbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.tin,.fi{padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--solid);width:100%}
.tin{max-width:300px}
.tsc{overflow:auto;border-radius:12px;border:1px solid var(--bd)}

.t th{background:var(--panel2);text-align:left;padding:9px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);cursor:pointer;white-space:nowrap;user-select:none}
.t td{padding:9px 12px;border-top:1px solid var(--bd);vertical-align:middle}
.t tr.rc{cursor:pointer}.t tr.rc:hover td{background:var(--acc2)}
.cv{position:relative;width:100%}
.mut{color:var(--mut)}.sm{font-size:12px}.b{font-weight:700}.r{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mb{position:fixed;inset:0;background:rgba(5,10,25,.55);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .15s}
.md{background:var(--solid);border-radius:20px;max-width:640px;width:100%;max-height:92vh;overflow:auto;border:1px solid var(--bd);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.md.wide{max-width:1000px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--solid);z-index:2}
.mbd{padding:20px}.x{border:0;background:var(--panel2);width:32px;height:32px;border-radius:9px;cursor:pointer}
.dw{position:fixed;inset:0;background:rgba(5,10,25,.45);z-index:90;display:flex;justify-content:flex-end}
.dwp{width:min(560px,100%);background:var(--solid);height:100%;overflow:auto;border-left:1px solid var(--bd);animation:slide .2s}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.fr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.fr .full{grid-column:1/-1}
.fl label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.tl{display:flex;gap:0;overflow:auto;padding:8px 0 4px}
.tls{flex:1;min-width:104px;text-align:center;position:relative;padding:0 4px}
.tls:before{content:"";position:absolute;top:19px;left:-50%;width:100%;height:3px;background:var(--bd)}.tls:first-child:before{display:none}
.tls.done:before,.tls.cur:before,.tls.warn:before{background:var(--ok)}
.dot{width:40px;height:40px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--solid);border:3px solid var(--bd);position:relative;z-index:1;font-weight:800;color:var(--mut)}
.tls.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}.tls.warn .dot{background:var(--warn);border-color:var(--warn);color:#fff}
.tls.cur .dot{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 6px var(--acc2);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px transparent}}
.tls b{font-size:12px;display:block}.tls small{font-size:11px;color:var(--mut)}
.al{display:flex;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:8px;cursor:pointer;align-items:flex-start;border:1px solid var(--bd);background:var(--solid);transition:.15s}
.al:hover{transform:translateX(3px)}.al.bad{border-left:4px solid var(--bad)}.al.warn{border-left:4px solid var(--warn)}.al.ok{border-left:4px solid var(--ok)}.al.info{border-left:4px solid var(--info)}
.bar{height:9px;background:var(--panel2);border-radius:9px;overflow:hidden;border:1px solid var(--bd)}.bar i{display:block;height:100%;border-radius:9px;background:var(--acc);transition:.4s}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--mut)}.kv dd{font-weight:600}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.chain span.n{padding:6px 11px;border-radius:10px;background:var(--acc2);color:var(--acc);font-weight:700;font-size:12px;cursor:pointer}.chain span.n:hover{filter:brightness(.95)}.chain i{font-style:normal;color:var(--mut)}
.seal{border:3px solid var(--ok);color:var(--ok);border-radius:14px;padding:12px 18px;font-weight:800;letter-spacing:1px;transform:rotate(-3deg);display:inline-block;background:var(--okb)}
.qcl{border:2px solid var(--acc);border-radius:16px;padding:16px;display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--acc2),var(--solid));max-width:460px}
.qcl .qr{background:#fff;padding:6px;border-radius:8px;min-width:96px;min-height:96px}
.chk{display:flex;gap:8px;align-items:center;padding:5px 0}.chk input{width:17px;height:17px;accent-color:var(--acc)}
.nodes{display:flex;align-items:stretch;gap:8px;overflow:auto;padding:6px 2px 10px}
.nd{min-width:150px;flex:1;background:var(--solid);border:1px solid var(--bd);border-radius:16px;padding:14px;cursor:pointer;text-align:center;transition:.18s;position:relative}
.nd:hover{transform:translateY(-4px);box-shadow:var(--sh)}.nd .e{font-size:30px}.nd.bad{border-color:var(--bad)}.nd.warn{border-color:var(--warn)}
.arr{align-self:center;color:var(--mut);font-size:20px}
.cb{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cb .d{min-height:78px;background:var(--solid);border:1px solid var(--bd);border-radius:10px;padding:5px;font-size:11px}.cb .d b{color:var(--mut)}.cb .h{text-align:center;font-weight:700;color:var(--mut);font-size:11px}
.chip{display:block;padding:2px 6px;border-radius:6px;margin-top:3px;font-size:10.5px;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdca{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.pcol{background:var(--panel2);border:1px solid var(--bd);border-radius:14px;padding:10px;min-height:200px}.pcol h4{margin-bottom:8px}
.pc{background:var(--solid);border:1px solid var(--bd);border-radius:11px;padding:10px;margin-bottom:8px;font-size:12.5px}
#toast{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.ts{background:#0b1220;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--sh);animation:slide .25s;max-width:360px}
#map{height:420px;border-radius:14px;z-index:1}
.sl{width:100%;accent-color:var(--acc)}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.hero{background:linear-gradient(120deg,#0b1326,#16306e);color:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:16px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.hero b{font-size:15px}.hero span{color:#aebbdd;font-size:12.5px}
.empty{padding:26px;text-align:center;color:var(--mut)}
details summary{cursor:pointer;font-weight:600}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g12,.g21{grid-template-columns:1fr}.pdca{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.app{grid-template-columns:1fr}.sb{position:fixed;left:-270px;width:260px;transition:.25s}.sb.open{left:0}#menuBtn{display:inline-flex}.g2,.g3,.g4{grid-template-columns:1fr}.top{padding:10px 12px;flex-wrap:wrap}#view{padding:14px}.fr{grid-template-columns:1fr}.pdca{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}.btn.inv span{display:none}}
</style>
</head>

<script>
/* =====================================================================
   MÓDULO: utils + datos (migrable a /js/data.js)
   CASE DATA = datos del caso académico · DEMO DATA = datos simulados coherentes
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(n,d=0)=>(+n).toLocaleString('es-AR',{maximumFractionDigits:d,minimumFractionDigits:d});
const n0=n=>nf(n,0),n1=n=>nf(n,1),n2=n=>nf(n,2);
const usd=n=>'US$ '+n0(n),P1=n=>n1(n)+'%',P2=n=>n2(n)+'%';
const sum=(a,f=x=>x)=>a.reduce((t,x)=>t+f(x),0);
const avg=(a,f=x=>x)=>a.length?sum(a,f)/a.length:0;
const sdv=a=>{const m=avg(a);return Math.sqrt(sum(a,x=>(x-m)**2)/Math.max(1,a.length-1))};
const TODAY=new Date(2026,9,5);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dd=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fd=s=>s?s.split('-').reverse().join('/'):'—';
const TODAYS=iso(TODAY);
const MONTHS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct'];
const mon=s=>pd(s).getMonth();
const pad=(n,l=4)=>String(n).padStart(l,'0');
const tag=k=>k==='CASE'?'<span class="dtag case">CASE DATA</span>':'<span class="dtag demo">DEMO DATA</span>';
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b0+(?=\d)/g,'');

/* ---------- Dataset del caso académico (CASE DATA) ---------- */
const CASE_F=[
 {id:'F01',label:'Rotura de embalaje termocontraíble en verificación aduanera',c:42,type:'Embalaje',stage:'Aduana'},
 {id:'F02',label:'Desajuste de eslingas de trincado',c:28,type:'Trincado',stage:'Transporte'},
 {id:'F03',label:'Abolladuras por golpes en izaje portuario',c:14,type:'Puerto',stage:'Puerto'},
 {id:'F04',label:'Oxidación / corrosión',c:7,type:'Transporte',stage:'Transporte'},
 {id:'F05',label:'Daños electrónicos por vibración',c:3,type:'Transporte',stage:'Transporte'},
 {id:'F06',label:'Pérdida de manuales / componentes',c:2,type:'Embalaje',stage:'Packaging'}];
const INC_TYPES=['Embalaje','Trincado','Transporte','Aduana','Puerto','Producción','Calidad','Documentación','Cliente'];
const STAT=['Planificado','Despachado','En ruta','Aduana','Puerto','Embarcado','En tránsito','Arribo','Entregado'];
const STG=[4,5,5,6,7,9,9,10,11];
const STAGES=['Producción','Control de calidad','Packaging','Documentación','Despacho','Transporte','Aduana','Puerto','Embarque','Destino','Entrega','Postventa'];
const NAMES=['M. Giménez','L. Herrera','C. Ibáñez','F. Sosa','R. Aguirre','J. Pereyra','A. Luna','D. Bustos','S. Ferreyra','P. Quiroga','V. Montoya','G. Cabrera'];
const INSPECTORS=['G. Maldonado','V. Romero','N. Acosta','T. Villalba'];
const QC_ITEMS={'Control de producto':['Dimensiones','Pintura','Soldaduras','Componentes','Electrónica','Funcionamiento'],
 'Control de embalaje':['Film termocontraíble','Protección de esquinas','Protección de superficies','Protección electrónica','Etiquetado','Manuales','Fotografías'],
 'Control de trincado':['Eslingas correctas','Cantidad de eslingas','Tensado','Puntos de anclaje','Inspección final']};
const ALL_QC=Object.values(QC_ITEMS).flat();
const LABOR_RATE=18,OVH=.12;

function seed(){
 let s=20260;const R=()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296};
 const pick=a=>a[Math.floor(R()*a.length)],ri=(a,b)=>Math.floor(a+R()*(b-a+1)),rn=(a,b)=>a+R()*(b-a);
 const wp=(it,w)=>{let r=R()*sum(w);for(let i=0;i<it.length;i++){r-=w[i];if(r<=0)return it[i]}return it[it.length-1]};
 const DB={cfg:{sla:18,cpkTarget:1.33},qcSeq:40,lotSeq:48,opSeq:116,incSeq:0,docSeq:0,actSeq:5,rcaSeq:1,poSeq:0};
 DB.suppliers=[
 ['S01','PackSur S.A.','Embalaje',58,78,66],['S02','TermoFilm Argentina','Embalaje',82,66,84],['S03','Eslingas del Plata','Embalaje',64,72,70],

function M(){const del=delivered(),act=DB.ships.filter(s=>s.st<8),ok=del.filter(s=>s.transit<=SLA()).length;
 const last30=DB.lots.filter(l=>dd(l.date,TODAYS)<=30);const prodTot=sum(DB.lots,l=>l.qty);
 const otif=del.length?del.filter(s=>s.transit<=SLA()&&!incOfLot(s.lotId).length).length/del.length*100:0;
 return{del,act,sla:del.length?ok/del.length*100:0,avgT:avg(del,s=>s.transit),prodMes:sum(last30,l=>l.qty),prodTot,lotsAct:DB.lots.filter(l=>lotStage(l)<11).length,
  transit:DB.lots.filter(l=>{const s=lotShip(l);return s&&s.st>=2&&s.st<=7}).length,incOpen:DB.incidents.filter(i=>i.status!=='Cerrado').length,clOpen:DB.claims.filter(c=>c.status!=='Resuelto').length,
  lg:avg(DB.ships,s=>logCost(s)),unit:avg(DB.lots,l=>prodCost(l.productId,l.qty).unit),crit:DB.inv.filter(i=>invStatus(i)[1]==='bad').length,docP:DB.docs.filter(docOpen).length,otif}}
function monthly(rows,f,agg='sum',dateKey){const o=Array.from({length:10},()=>[]);rows.forEach(r=>{const v=f(r);if(v!=null)o[mon(dateKey?r[dateKey]:r.dispatch)].push(v)});return o.map(a=>agg==='sum'?sum(a):agg==='avg'?(a.length?+avg(a).toFixed(2):null):a.length)}

function vQuality(){const L=DB.lots,pend=L.filter(l=>l.qc.status==='Pendiente'),rej=sum(L,l=>l.qc.hist.filter(h=>h.res==='Rechazado').length);
 const run=L.filter(l=>l.qc.status!=='Pendiente'),fails=sum(run,l=>ALL_QC.filter(k=>l.qc.checks[k]===false).length),rate=run.length?fails/(run.length*ALL_QC.length)*100:0;

 <div class="kg"><div class="kpi warn"><small>Controles pendientes</small><b>${pend.length}</b></div><div class="kpi ok"><small>Aprobados</small><b>${L.filter(l=>l.qc.status==='Aprobado').length}</b></div><div class="kpi warn"><small>Observados</small><b>${L.filter(l=>l.qc.status==='Observado').length}</b></div><div class="kpi bad"><small>Rechazos históricos</small><b>${rej}</b></div><div class="kpi"><small>Tasa de defectos</small><b>${P2(rate)}</b><span>ítems fallados / controlados</span></div><div class="kpi bad"><small>Incidencias</small><b>${DB.incidents.length}</b></div></div>
 <div class="grid g2" style="margin-bottom:16px"><div class="card"><h3>Pareto de ítems de control fallados</h3>${cv('q-par',240)}</div><div class="card"><h3>Resultados de calidad por mes</h3>${cv('q-tr',240)}</div></div>
 <div class="card"><h3>Lotes y controles</h3>${table('qc',[{h:'Lote',k:'id',f:l=>`<b>${l.id}</b>`},{h:'Producto',v:l=>getProd(l.productId).name,f:l=>esc(getProd(l.productId).name)},{h:'QC ID',v:l=>l.qc.id||'',f:l=>l.qc.id||'—'},{h:'Resultado',v:l=>l.qc.status,f:l=>badge(l.qc.status)},{h:'Inspector',v:l=>l.qc.inspector,f:l=>l.qc.date?l.qc.inspector:'—'},{h:'Fecha',v:l=>l.qc.date||'',f:l=>fd(l.qc.date)},{h:'',v:l=>'',f:l=>`<button class="btn sm ${l.qc.status==='Aprobado'?'':'pri'}" onclick="event.stopPropagation();${l.qc.status==='Aprobado'?`openLabel('${l.id}')`:`openQC('${l.id}')`}">${l.qc.status==='Aprobado'?'🏷 Etiqueta':'✔ Ejecutar control'}</button>`}],L.slice().reverse(),{click:'openLot'})}</div>`}
function afterQuality(){const cnt={};DB.lots.forEach(l=>ALL_QC.forEach(k=>{if(l.qc.checks[k]===false)cnt[k]=(cnt[k]||0)+1}));const pr=paretoCalc(Object.entries(cnt).map(([k,c])=>({id:k,c})));
 if(pr.length)paretoChart('q-par',pr);else Q.push(()=>{const e=document.getElementById('q-par');if(e)e.parentNode.innerHTML='<div class="empty">Sin fallas registradas</div>'});
 const by=s=>MONTHS.map((_,i)=>DB.lots.filter(l=>mon(l.date)===i&&l.qc.status===s).length);

function openQC(id){const l=getLot(id);let n=0;
 const grp=Object.entries(QC_ITEMS).map(([g,it])=>`<div class="card" style="margin-bottom:10px;padding:12px"><b>${g}</b>${it.map(i=>{const k=n++;return`<label class="chk"><input type="checkbox" id="qc_${k}" ${l.qc.checks[i]?'checked':''}> ${i}</label>`}).join('')}</div>`).join('');

function submitQC(id){const l=getLot(id),checks={};let n=0,fails=0;Object.values(QC_ITEMS).flat().forEach(i=>{const ok=document.getElementById('qc_'+(n++)).checked;checks[i]=ok;if(!ok)fails++});
 const res=fails===0?'Aprobado':fails<=2?'Observado':'Rechazado';l.qc.hist.push({date:TODAYS,res});
 l.qc.status=res==='Rechazado'?'Rechazado':res;l.qc.checks=checks;l.qc.inspector=v$('qc_i');l.qc.date=TODAYS;
 if(res==='Aprobado'){l.qc.id=l.qc.id||'QC-2026-'+pad(++DB.qcSeq);if(l.pre===1)l.pre=2}
 save();closeModal();
 if(res==='Aprobado'){openLabel(id,true)}else{toast(`Resultado: ${res.toUpperCase()} (${fails} ítem/s con desvío)`);}render()}
function qrDraw(id,text){Q.push(()=>{const e=document.getElementById(id);if(!e)return;e.innerHTML='';if(typeof QRCode!=='undefined'){new QRCode(e,{text,width:92,height:92,correctLevel:QRCode.CorrectLevel.M});return}
 let h=0;for(const ch of text)h=(h*31+ch.charCodeAt(0))>>>0;const c=document.createElement('canvas');c.width=c.height=92;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,92,92);g.fillStyle='#000';const N=21,z=92/N;for(let y=0;y<N;y++)for(let x=0;x<N;x++){h=(h*1103515245+12345)>>>0;const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);if(f){const ex=x%14,ey=y%14;const edge=ex===0||ex===6||ey===0||ey===6||(ex>1&&ex<5&&ey>1&&ey<5);if(edge&&(x<7||x>13)&&(y<7||y>13||x<7))g.fillRect(x*z,y*z,z,z)}else if(h>>>29&1)g.fillRect(x*z,y*z,z,z)}e.appendChild(c)})}
function openLabel(id,fresh){const l=getLot(id),p=getProd(l.productId),url=location.href.split('#')[0]+'#/lot/'+id;
 openModal('Etiqueta de calidad',`${fresh?`<div style="text-align:center;margin-bottom:16px"><div class="seal">✓ QUALITY CONTROL PASSED</div><p class="sm mut" style="margin-top:10px">Quality Control ID generado: <b>${l.qc.id}</b></p></div>`:''}<div class="qcl"><div class="qr" id="qr-${id}"></div><div><b style="color:var(--acc);letter-spacing:.5px">AGROTECH QUALITY PASSED</b><dl class="kv" style="grid-template-columns:70px 1fr;margin-top:6px"><dt>Lote</dt><dd>${id}</dd><dt>Producto</dt><dd>${esc(p.name)}</dd><dt>Fecha</dt><dd>${fd(l.qc.date)}</dd><dt>Inspector</dt><dd>${l.qc.inspector}</dd><dt>Control</dt><dd>${l.qc.id}</dd></dl></div></div><p class="sm mut" style="margin-top:10px">El QR lleva a la ficha digital del lote.</p><div class="row" style="margin-top:12px"><button class="btn pri" onclick="openLot('${id}')">Abrir ficha del lote</button><button class="btn" onclick="window.print()">Imprimir</button></div>`);qrDraw('qr-'+id,url);flush()}

const CONT={'20DC':{n:"Contenedor 20' DC",L:5.9,W:2.35,H:2.39,kg:28000},'40HC':{n:"Contenedor 40' HC",L:12.03,W:2.35,H:2.69,kg:26500},'FR40':{n:"Flat rack 40'",L:12.1,W:2.4,H:3.0,kg:40000},'TRK':{n:'Camión con semirremolque',L:13.6,W:2.45,H:2.9,kg:27000}};
function layout(c,items){const out=[],MG=1.05;let x=0,y=0,rowL=0,bad=0;items.forEach(it=>{const p=getProd(it.p);for(let k=0;k<it.q;k++){const l=p.dims[0]*MG,w=p.dims[1]*MG,h=p.dims[2]*MG;if(y+w>c.W+1e-6){x+=rowL;y=0;rowL=0}const over=x+l>c.L+1e-6||h>c.H+1e-6;if(over)bad++;out.push({p:p.id,x,y,l,w,over});y+=w;rowL=Math.max(rowL,l)}});return{out,bad}}
function vPackaging(){const t=tabOf('pack','plan');return`<div class="ph"><div><h1>Packaging Planner</h1><p>Plan de carga, estándares de embalaje y control F01/F02.</p></div>${tag('DEMO')}</div>${tabs('pack',[['plan','Planificador de carga'],['std','Packaging Standards'],['rec','Registro por lote']])}${t==='plan'?pkPlan():t==='std'?pkStd():pkRec()}`}
function pkPlan(){const c=CONT[ST.pk.cont],it=ST.pk.items,L=layout(c,it),vol=sum(it,i=>{const d=getProd(i.p).dims;return d[0]*d[1]*d[2]*1.1*i.q}),kg=sum(it,i=>getProd(i.p).kg*i.q*1.04),cv_=c.L*c.W*c.H,uv=vol/cv_*100,uw=kg/c.kg*100,floorA=sum(L.out,o=>o.l*o.w)/(c.L*c.W)*100,sc=640/c.L;
 const svg=`<svg viewBox="0 0 660 ${c.W*sc+20}" width="100%"><rect x="10" y="10" width="${c.L*sc}" height="${c.W*sc}" rx="6" fill="var(--panel2)" stroke="var(--mut)" stroke-width="2"/>${L.out.map((o,k)=>`<rect x="${10+o.x*sc}" y="${10+o.y*sc}" width="${o.l*sc-2}" height="${o.w*sc-2}" rx="4" fill="${o.over?COL.bad:['#1f5bff','#0ea5e9','#7c3aed','#16a34a','#f59e0b'][DB.products.findIndex(p=>p.id===o.p)%5]}" opacity=".78"><title>${o.p}</title></rect><text x="${10+o.x*sc+6}" y="${10+o.y*sc+16}" font-size="11" fill="#fff" font-weight="700">${o.p}</text>`).join('')}</svg>`;

 <div class="card"><h3>Pedidos de reposición</h3>${DB.pos.length?table('pos',[{h:'Pedido',k:'id'},{h:'Ítem',v:p=>getInv(p.code).name,f:p=>esc(getInv(p.code).name)},{h:'Cant.',k:'qty'},{h:'Fecha',k:'date',f:p=>fd(p.date)},{h:'Estado',k:'status',f:p=>badge(p.status,p.status==='Emitida'?'info':'ok')},{h:'',v:p=>'',f:p=>p.status==='Emitida'?`<button class="btn sm" onclick="recibirPO('${p.id}')">Registrar recepción</button>`:''}],DB.pos,{search:false}):'<div class="empty">Sin pedidos emitidos. Usá "Reponer" en los ítems bajo mínimo.</div>'}</div>`}
function reponer(code){const i=getInv(code),q=i.min-i.stock;DB.pos.push({id:'PO-'+pad(++DB.poSeq,3),code,qty:q,date:TODAYS,status:'Emitida'});save();toast(`Pedido emitido: reponer ${q} unidades de ${i.name}`);render()}

const NODES=[{e:'🏭',n:'Planta',sts:[0],resp:'Jefe de Planta'},{e:'🚛',n:'Transporte terrestre',sts:[1,2],resp:'Transporte Pampa'},{e:'🛃',n:'Aduana de salida',sts:[3],resp:'Despachos Mercosur'},{e:'⚓',n:'Puerto',sts:[4],resp:'Agente portuario'},{e:'🚢',n:'Buque',sts:[5,6],resp:'Naviera'},{e:'🛃',n:'Aduana destino',sts:[7],resp:'Agente destino'},{e:'🚛',n:'Transporte final',sts:[],resp:'Transportista local'},{e:'🏢',n:'Cliente',sts:[8],resp:'Cliente'}];

function nodeStats(i){const N=NODES[i],sh=DB.ships,cur=sh.filter(s=>N.sts.includes(s.st));
 const t=[avg(sh,s=>dd(s.prodDate,s.dispatch)),avg(sh,s=>getRoute(s.routeId).days),avg(sh.filter(s=>s.channel),s=>s.customsDays),avg(sh.filter(s=>s.portWait),s=>s.portWait),avg(delivered(),s=>s.transit)-avg(sh,s=>getRoute(s.routeId).days)-5,1.5,2,0][i];

 const lim=[12,2.5,3.5,2.5,12,2,3,99][i];return{cur,t,inc,docs,state:t>lim||inc.length>8?'bad':inc.length>3?'warn':'ok',lim}}
function vLogistics(){const t=tabOf('log','tower');return`<div class="ph"><div><h1>Logistics Control Tower</h1><p>De la planta al cliente: estado, tiempos, responsables, incidencias y documentación por etapa.</p></div>${tag('DEMO')}</div>${tabs('log',[['tower','Torre de control'],['map','Operations Map'],['routes','Route Planner'],['fuel','Combustible'],['plan','Shipment Planner']])}${t==='tower'?logTower():t==='map'?opsMap():t==='routes'?routePlan():t==='fuel'?fuelPlan():shipPlan()}`}

 <div class="card"><h3>Detalle por etapa</h3>${table('tw',[{h:'Etapa',k:'n',f:r=>`<b>${r.e} ${r.n}</b>`},{h:'Estado',v:r=>r.s.state,f:r=>badge({ok:'Normal',warn:'Atención',bad:'Crítico'}[r.s.state],r.s.state)},{h:'Embarques',v:r=>r.s.cur.length,f:r=>r.s.cur.length},{h:'Tiempo prom.',v:r=>r.s.t,f:r=>r.i===7?'—':n1(r.s.t)+' d'},{h:'Responsable',k:'resp'},{h:'Incidencias',v:r=>r.s.inc.length,f:r=>r.s.inc.length},{h:'Docs pendientes',v:r=>r.s.docs.length,f:r=>r.s.docs.length}],NODES.map((N,i)=>({...N,id:i,i,s:nodeStats(i)})),{click:'openNode',search:false})}</div>`}

function opsMap(){return`<div class="card"><h3>Operations Map · clic en cada nodo</h3><div class="nodes" style="flex-wrap:wrap">${NODES.map((N,i)=>{const s=nodeStats(i);return`<div class="nd ${s.state}" onclick="openNode(${i})" style="min-width:170px"><div class="e">${N.e}</div><b>${N.n}</b><div class="sm mut" style="margin:4px 0">${i===7?'':n1(s.t)+' d prom.'}</div><div>${badge(s.inc.length+' incid.',s.inc.length>5?'bad':'mut')} ${badge(s.docs.length+' docs',s.docs.length?'warn':'mut')}</div><div class="sm mut" style="margin-top:4px">${N.resp}</div></div>${i<7?'<div class="arr">→</div>':''}`}).join('')}</div><p class="sm mut" style="margin-top:8px">Rojo = tiempo sobre el límite o más de 8 incidentes. El nodo aduana/puerto es la restricción detectada (TOC).</p></div>`}
function routeScore(rs){const f=(k,w)=>{const a=rs.map(r=>r[k]),mn=Math.min(...a),mx=Math.max(...a);return r=>(mx===mn?0:(r[k]-mn)/(mx-mn))*w};const F=[f('cost',.3),f('days',.25),f('risk',.2),f('cong',.15),f('cust',.1)];return rs.map(r=>({...r,score:sum(F,g=>g(r))}))}
function routePlan(){const rs=routeScore(DB.routes).sort((a,b)=>a.score-b.score),best=rs[0],w=rs[rs.length-1];
 return`<div class="card"><h3>Comparación de rutas ${tag('DEMO')}</h3><div class="tsc"><table class="t"><thead><tr><th style="cursor:default">Criterio</th>${rs.map(r=>`<th style="cursor:default">${r.name}${r.id===best.id?' ⭐':''}</th>`).join('')}</tr></thead><tbody>${[['Recorrido',r=>r.desc],['Distancia',r=>n0(r.km)+' km'],['Tiempo',r=>n1(r.days)+' d'],['Costo estimado',r=>usd(r.cost)],['Peajes',r=>usd(r.tolls*8)],['Combustible',r=>n0(r.km*.34)+' L · '+usd(r.km*.34*1.15)],['Riesgo (1-10)',r=>r.risk],['Congestión (1-10)',r=>r.cong],['Complejidad aduana (1-10)',r=>r.cust],['Paradas',r=>r.stops],['Puntaje (menor = mejor)',r=>`<b>${n2(r.score)}</b>`]].map(([l,f])=>`<tr><td><b>${l}</b></td>${rs.map(r=>`<td ${r.id===best.id?'style="background:var(--okb)"':''}>${f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <div class="al ok" style="margin-top:14px;cursor:default"><span>✅</span><div><b>Ruta recomendada: ${best.name} — ${best.desc}.</b> Obtiene el menor puntaje ponderado (costo 30%, tiempo 25%, riesgo 20%, congestión 15%, aduana 10%): cuesta ${usd(w.cost-best.cost)} menos que ${w.name} y reduce el tránsito en ${n1(w.days-best.days)} días. Con puerto de salida ${best.port}.</div></div></div>`}
function fuelPlan(){return`<div class="grid g2"><div class="card"><h3>Planificador de combustible</h3><div class="fr">${field('Ruta',sel('f_r',DB.routes.map(r=>[r.id,r.name+' · '+r.km+' km']),'RA','onchange="fuelRoute()"'))}${field('Kilómetros',inp('f_k',ST.fuel.km,'number','oninput="fuelCalc()"'))}${field('Consumo (L/100 km)',inp('f_c',ST.fuel.cons,'number','oninput="fuelCalc()"'))}${field('Precio combustible (US$/L)',inp('f_p',ST.fuel.price,'number','step="0.01" oninput="fuelCalc()"'))}${field('Capacidad de tanque (L)',inp('f_t',ST.fuel.tank,'number','oninput="fuelCalc()"'))}</div></div><div class="card"><h3>Resultado del viaje</h3><div id="fuelOut"></div></div></div>`}

function conflicts(){const out=[];DB.ships.filter(s=>s.st<=2).forEach(s=>{const tk=getTruck(s.truck);
 if(s.packDate>s.docClose)out.push({sev:'bad',id:s.id,msg:`${s.id}: El packaging termina (${fd(s.packDate)}) después del cierre documental (${fd(s.docClose)}).`});

 else if(tk&&[tk.seguro,tk.vtv].some(d=>d<s.eta&&daysTo(d)<=45))out.push({sev:'warn',id:s.id,msg:`${s.id}: el camión ${tk.id} tiene documentación que vence antes del ETA.`});

function spcCalc(){const c=ST.spc,V=SPCV[c.v];let pts=V.data().filter(p=>PER[c.per][1](mon(p.d)));if(pts.length<4)pts=V.data();const vals=pts.map(p=>p.v);let cl,sig,ucl,lcl,series,labels;
 if(c.type==='I'||c.n<2){series=vals;labels=pts.map(p=>p.l);cl=avg(vals);const mr=vals.slice(1).map((x,i)=>Math.abs(x-vals[i]));sig=avg(mr)/1.128;ucl=cl+3*sig;lcl=cl-3*sig}
 else{const n=c.n,g=[];for(let i=0;i+n<=vals.length;i+=n)g.push(vals.slice(i,i+n));series=g.map(a=>+avg(a).toFixed(3));labels=g.map((_,i)=>'G'+(i+1));cl=avg(series);const rb=avg(g,a=>Math.max(...a)-Math.min(...a));sig=rb/D2[n];ucl=cl+3*sig/Math.sqrt(n);lcl=cl-3*sig/Math.sqrt(n)}
 const ooc=series.map((v,i)=>v>ucl||v<lcl?i:-1).filter(i=>i>=0);const run=[];series.forEach((v,i)=>{if(i>=6){const w=series.slice(i-6,i+1);if(w.every(x=>x>cl)||w.every(x=>x<cl))run.push(i)}});

function capCalc(){const u=v$('cp_u')===''?null:+v$('cp_u'),l=v$('cp_l')===''?null:+v$('cp_l'),m=+v$('cp_m'),s=+v$('cp_s');ST.capIn={usl:u==null?'':u,lsl:l==null?'':l,m,s};const cu=u!=null?(u-m)/(3*s):Infinity,cl=l!=null?(m-l)/(3*s):Infinity,cpk=Math.min(cu,cl),cp=u!=null&&l!=null?(u-l)/(6*s):null,dg=diag(isFinite(cpk)?cpk:null);
 const o=document.getElementById('capOut');if(o)o.innerHTML=`<div class="big" style="color:var(--${dg[1]})">${isFinite(cpk)?n2(cpk):'—'}</div><div>${badge(dg[0],dg[1])}</div>${kvl([['Cp',cp==null?'— (un solo límite)':n2(cp)],['Cpk',isFinite(cpk)?n2(cpk):'—'],['Media',n2(m)],['Sigma',n2(s)],['LSE / LIE',(u==null?'—':u)+' / '+(l==null?'—':l)]])}<div class="bar ${dg[1]}" style="margin-top:10px"><i style="width:${Math.max(0,Math.min(100,(isFinite(cpk)?cpk:0)/1.67*100))}%"></i></div>`}
function capLoad(){const c=capab(SPCV.transit.data().map(p=>p.v),SLA(),null);ST.capIn={usl:SLA(),lsl:'',m:+c.m.toFixed(2),s:+c.s.toFixed(2)};render()}
function capTarget(){const m=+v$('cp_m'),u=+v$('cp_u');const s=(u-m)/(3*DB.cfg.cpkTarget);if(!(s>0))return toast('Con esta media ya excede el LSE: hay que reducir primero la media');ST.capIn.s=+s.toFixed(2);toast('σ requerida ≈ '+n2(s));render()}

function wiBase(){const sh=DB.ships,ch=sh.filter(s=>s.channel);return{ships:3,cd:+avg(ch,s=>s.customsDays).toFixed(1),td:+avg(sh,s=>getRoute(s.routeId).days).toFixed(1),inc:+(DB.incidents.length/10).toFixed(1),red:Math.round(ch.filter(s=>s.channel==='Rojo').length/ch.length*100),fuel:1.15,pack:380,insp:1}}
function simulate(p){const b=wiBase(),del=delivered(),T0=avg(del,s=>s.transit),sd0=sdv(del.map(s=>s.transit)),fl=avg(DB.ships,s=>getRoute(s.routeId).km*.34),base=avg(DB.ships,s=>logCost(s)-s.costs.fuel),ic=avg(DB.incidents,i=>i.cost);
 const tr=T0+(p.cd-b.cd)+(p.td-b.td)+(p.red-b.red)/100*4,ratio=Math.min(1,p.insp/Math.max(1,p.ships)),r0=Math.min(1,b.insp/b.ships),sg=Math.max(.8,sd0*(1+(p.red-b.red)/100*1.5)*(1-.25*(ratio-r0))),sla=normCdf((SLA()-tr)/sg)*100,cpk=(SLA()-tr)/(3*sg),incE=p.inc*(1-.5*ratio),cap=p.ships/10*100;
 const cost=p.ships*(base+fl*p.fuel+p.pack)+incE*ic+p.insp*120,risk=Math.max(0,Math.min(100,(100-sla)+Math.max(0,incE-3)*3+Math.max(0,cap-80)));return{tr,sg,sla,cpk,incE,cap,cost,risk}}
const SOL=()=>{const b=wiBase();return{...b,cd:+(b.cd*.6).toFixed(1),red:Math.round(b.red*.35),inc:+(b.inc*.25).toFixed(1),insp:b.ships,pack:520}};

try{const t=localStorage.getItem('agt_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#gs').addEventListener('input',e=>runSearch(e.target.value));
$('#gs').addEventListener('keydown',e=>{if(e.key==='Enter'){const r=runSearch(e.target.value);if(r.length)pickSearch(0)}if(e.key==='Escape')$('#gsr').classList.remove('on')});
window.addEventListener('hashchange',route);
buildNav();route();
</script>
